name: Validate Flyers PWA
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: flyers-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify cached-file version and image policy
        run: |
          python scripts/sync-catalog.py --check
          python scripts/build-coverage.py --check
          python scripts/build-offline.py --check
          node --test tests/illustrations.test.cjs
      - name: Install isolated browser-test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/flyers-venv"
          "$RUNNER_TEMP/flyers-venv/bin/pip" install playwright==1.55.0
          "$RUNNER_TEMP/flyers-venv/bin/python" -m playwright install --with-deps chromium
      - name: Check real offline storage, approval, touch and history
        run: |
          "$RUNNER_TEMP/flyers-venv/bin/python" tests/browser_illustrations.py --report "$RUNNER_TEMP/flyers-browser.json"
          echo '## Native browser checks' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/flyers-browser.json" >> "$GITHUB_STEP_SUMMARY"
